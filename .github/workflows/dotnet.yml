name: .NET Build and Smoke Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build & smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Fouroam-Server.slnx

      - name: Build
        run: dotnet build Fouroam-Server.slnx --configuration Release --no-restore

      - name: Network smoke test
        run: dotnet run --project tests/Fouroam.SmokeTests --configuration Release --no-build
